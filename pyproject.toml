[project]
name = "rest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.0+cu130",
    "transformers==5.9.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "datasets==4.8.5",
    "accelerate==1.13.0",
    "huggingface-hub==1.16.1",
    "numpy==2.4.6",
    "tqdm",
    "python-dateutil",
]

[dependency-groups]
dev = ["ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rest"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["refs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
